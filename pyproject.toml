[project]
name = "llm-robot-assembly"
version = "0.2.0"
description = "MuJoCo-first robot assembly with LLM planning and experience reuse"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coacd==1.0.14",
    "flask==3.1.3",
    "imageio-ffmpeg==0.8.1",
    "langgraph==1.2.19",
    "manifold3d==3.3.2",
    "mink==1.3.0",
    "mujoco==3.17.0",
    "networkx==3.6.1",
    "pillow==13.0.0",
    "rtree==1.4.1",
    "openai==3.42.0",
    "scipy==1.17.1",
    "trimesh==5.2.2",
]

[project.optional-dependencies]
cad = [
    "coacd==1.0.14",
]
vision = ["transformers==4.39.3", "safetensors==0.6.2"]

[tool.uv]
package = false
