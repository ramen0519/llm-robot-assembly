[project]
name = "llm-robot-assembly"
version = "0.1.0"
description = "MuJoCo-first robot assembly with LLM planning and experience reuse"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph==1.2.19",
    "manifold3d==3.3.2",
    "mink==1.3.0",
    "mujoco==3.17.0",
    "openai==3.42.0",
    "scipy==1.17.1",
]

[project.optional-dependencies]
cad = [
    "coacd>=1.0.14",
]

[tool.uv]
package = false
