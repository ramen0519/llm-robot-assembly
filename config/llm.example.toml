# Copy to config/local.llm.toml; fill model/pricing/budget before enabling.
# This disabled example sends no requests. Never put the API key in this file.
[llm]
enabled = false
provider = "openai"
model = ""
api_key_env = "OPENAI_API_KEY"
max_model_requests = 8
max_input_tokens = 12000
max_output_tokens = 2048
max_total_tokens = 60000
max_cost_usd = "0"
input_usd_per_million = "0"
output_usd_per_million = "0"
pricing_source = ""
pricing_as_of = ""
timeout_seconds = 45.0
reasoning_effort = ""
